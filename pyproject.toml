[project]
name = "sqlconsensus"
version = "0.1.0"
description = "Confidence estimation for Text-to-SQL from structure and execution"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlglot==30.17.0",
    "func-timeout>=4.3.5",
    "vllm>=0.10",
    "openai>=1.99",
    "pyserini>=0.44",
    "nltk>=3.9",
    "ijson>=3.3",
]

[project.scripts]
sqlconsensus = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
